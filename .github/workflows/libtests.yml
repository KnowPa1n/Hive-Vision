name: ftc_ball_chase_lib tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  libtests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ftc_ball_chase_lib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Stage FTC SDK + Pedro jars from Maven Central
        run: |
          mkdir -p lib out
          curl -sSL -o a.tmp https://repo1.maven.org/maven2/org/firstinspires/ftc/RobotCore/11.2.1/RobotCore-11.2.1.aar
          unzip -p a.tmp classes.jar > lib/ftc_robotcore.jar
          curl -sSL -o a.tmp https://repo1.maven.org/maven2/org/firstinspires/ftc/Hardware/11.2.1/Hardware-11.2.1.aar
          unzip -p a.tmp classes.jar > lib/ftc_hardware.jar
          curl -sSL -o lib/pedro_core.jar https://repo1.maven.org/maven2/com/pedropathing/core/2.1.2/core-2.1.2.jar
          curl -sSL -o a.tmp https://repo1.maven.org/maven2/com/pedropathing/ftc/2.1.2/ftc-2.1.2.aar
          unzip -p a.tmp classes.jar > lib/pedro_ftc.jar
          rm -f a.tmp
          ls -la lib

      - name: Compile final + wrapper + tests
        run: |
          javac -encoding UTF-8 -cp "lib/*" -d out \
            final/*.java wrapper/*.java tests/*.java

      - name: BallMath self-test
        run: java -cp "out:lib/*" org.firstinspires.ftc.teamcode.BallMath

      - name: WrapperLogicTest
        run: java -cp "out:lib/*" org.firstinspires.ftc.teamcode.wrapper.WrapperLogicTest

      - name: AllTests
        run: java -cp "out:lib/*" org.firstinspires.ftc.teamcode.tests.AllTests